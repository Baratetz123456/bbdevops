<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hexGrad" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E07A5F"/>
      <stop offset="100%" stop-color="#B2533E"/>
    </linearGradient>
    <!-- Top Facet Light -->
    <linearGradient id="topFacet" x1="10" y1="8" x2="54" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F7D1A9"/>
      <stop offset="100%" stop-color="#D4A373"/>
    </linearGradient>
    <!-- Gear Accent -->
    <linearGradient id="gearGrad" x1="32" y1="12" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="100%" stop-color="#FAF3EA"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1A120E" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Hexagonal Chassis Base -->
  <polygon points="32,3 58,18 58,46 32,61 6,46 6,18" rx="6" fill="url(#hexGrad)" stroke="#F4C28D" stroke-width="1.5" stroke-linejoin="round" filter="url(#shadow)"/>

  <!-- Top Isometric Facet (Cloud/Engine Depth) -->
  <polygon points="32,5 56,19 32,31 8,19" fill="url(#topFacet)" opacity="0.35"/>

  <!-- Automation Gear & Node Notches -->
  <!-- Top Node -->
  <circle cx="32" cy="5" r="2.5" fill="#FFF8F0"/>
  <!-- Left Nodes -->
  <circle cx="7" cy="19" r="2" fill="#D4A373"/>
  <circle cx="7" cy="45" r="2" fill="#D4A373"/>
  <!-- Right Nodes -->
  <circle cx="57" cy="19" r="2" fill="#D4A373"/>
  <circle cx="57" cy="45" r="2" fill="#D4A373"/>
  <!-- Bottom Node -->
  <circle cx="32" cy="60" r="2.5" fill="#FFF8F0"/>

  <!-- Core Engineered BB Monogram with Cloud Loop -->
  <g fill="url(#gearGrad)">
    <!-- First 'B' with Terminal Chevron Cut -->
    <path d="M17 19H27C30.5 19 33 21 33 24C33 26 31.8 27.5 29.8 28.2C32.4 29 33.8 30.8 33.8 33.5C33.8 37 31 39.5 27 39.5H17V19ZM22 23.5V27.2H26.2C27.5 27.2 28.5 26.5 28.5 25.3C28.5 24.2 27.5 23.5 26.2 23.5H22ZM22 30.8V35H26.5C28 35 29 34.2 29 32.9C29 31.6 28 30.8 26.5 30.8H22Z"/>

    <!-- Second 'B' with Integrated Loop -->
    <path d="M34.5 23H44C47.5 23 50 25 50 28C50 30 48.8 31.5 46.8 32.2C49.4 33 50.8 34.8 50.8 37.5C50.8 41 48 43.5 44 43.5H34.5V23ZM39.5 27.5V31.2H43.2C44.5 31.2 45.5 30.5 45.5 29.3C45.5 28.2 44.5 27.5 43.2 27.5H39.5ZM39.5 34.8V39H43.5C45 39 46 38.2 46 36.9C46 35.6 45 34.8 43.5 34.8H39.5Z"/>
  </g>

  <!-- DevOps Pipeline Connect Line Accent -->
  <path d="M19 45L27 53L45 53" stroke="#FFF8F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <circle cx="45" cy="53" r="1.5" fill="#FFF8F0"/>
</svg>