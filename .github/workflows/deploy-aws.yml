name: CD - Deploy to AWS S3 & CloudFront

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Ensure only one production deployment runs at a time to prevent race conditions
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter (Oxlint)
        run: npm run lint

      - name: Build Production Bundle
        env:
          VITE_CONTACT_API_URL: ${{ secrets.VITE_CONTACT_API_URL }}
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync Static Assets to S3 (Immutable 1-Year Cache)
        env:
          S3_BUCKET_RAW: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          S3_BUCKET=$(echo "$S3_BUCKET_RAW" | tr -d '[:space:]')
          aws s3 sync dist/assets "s3://${S3_BUCKET}/assets" \
            --cache-control "max-age=31536000,public,immutable" \
            --delete

      - name: Sync Root Files to S3 (No-Cache for Entry Points)
        env:
          S3_BUCKET_RAW: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          S3_BUCKET=$(echo "$S3_BUCKET_RAW" | tr -d '[:space:]')
          aws s3 sync dist/ "s3://${S3_BUCKET}" \
            --exclude "assets/*" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --delete

      - name: Invalidate CloudFront Cache
        env:
          CF_DIST_RAW: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          CF_DIST_ID=$(echo "$CF_DIST_RAW" | tr -d '[:space:]')
          aws cloudfront create-invalidation \
            --distribution-id "$CF_DIST_ID" \
            --paths "/*"

      - name: Deployment Summary
        env:
          S3_BUCKET_RAW: ${{ secrets.S3_BUCKET_NAME }}
          CF_DIST_RAW: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          S3_BUCKET=$(echo "$S3_BUCKET_RAW" | tr -d '[:space:]')
          CF_DIST_ID=$(echo "$CF_DIST_RAW" | tr -d '[:space:]')
          echo "### 🚀 Production Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Bucket:** \`s3://${S3_BUCKET}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **CloudFront Distribution:** \`${CF_DIST_ID}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Region:** \`${{ secrets.AWS_REGION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
